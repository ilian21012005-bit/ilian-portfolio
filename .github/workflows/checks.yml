name: Validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Vérifier les routes sur le build
        run: |
          npm run start -- --port 3100 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..30}; do curl -fsS http://localhost:3100/fr >/dev/null && break; sleep 1; done
          node scripts/check-site.mjs
